      },
      "entrypoint": [
        "/bin/sh",
        "-c",
        "dotnet \"$$SERVICE_DLL\" --migrate && exec dotnet \"$$SERVICE_DLL\""
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "cap_drop": [
        "ALL"
      ],
      "build": {
        "context": ".",
        "dockerfile": "infrastructure/Docker/Platform.Dockerfile",
        "args": {
          "SERVICE_NAME": "Reporting"
        }
      },
      "environment": {
        "PLATFORM_SETTINGS": "/run/portal/settings.json",
        "ASPNETCORE_ENVIRONMENT": "Development",
        "Platform__BrokerEnabled": "false",
        "Database__ApplyMigrationsOnStartup": "false",
        "DOTNET_gcServer": "${DOTNET_SERVER_GC:-0}",
        "ASPNETCORE_URLS": "http://+:8080",
        "PortalLogging__Directory": "/app/Logs/Application/reporting",
        "PortalLogging__ConsoleEnabled": "true",
        "DOTNET_PROCESSOR_COUNT": "${SERVICE_PROCESSOR_COUNT:-2}",
        "Redis__Enabled": "false"
      }
    },
