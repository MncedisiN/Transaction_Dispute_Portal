        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "cap_drop": [
        "ALL"
      ],
      "build": {
        "context": "./DisputePortal.App"
      },
      "restart": "unless-stopped",
      "ports": [
        "${PORTAL_HTTP_BIND:-127.0.0.1:8080}:8080",
        "${PORTAL_HTTPS_BIND:-127.0.0.1:8443}:8443",
        "${PORTAL_SETUP_BIND:-127.0.0.1:8081}:8081"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        "local-https:/run/https:ro"
      ]
    },
    "postgres": {
      "environment": {
        "POSTGRES_PASSWORD_FILE": "/run/setup/admin-password",
        "POSTGRES_USER": "postgres",
        "POSTGRES_DB": "postgres"
      },
      "depends_on": {
        "bootstrap": {
          "condition": "service_completed_successfully"
        }
      },
      "entrypoint": [
        "/bin/sh",
        "-c",
        "set -e; mkdir -p /docker-entrypoint-initdb.d; cp /run/setup/init/00-databases.sql /docker-entrypoint-initdb.d/00-databases.sql; chown postgres:postgres /docker-entrypoint-initdb.d/00-databases.sql; chmod 600 /docker-entrypoint-initdb.d/00-databases.sql; exec /usr/local/bin/docker-entrypoint.sh postgres"
      ],
      "healthcheck": {
        "retries": 30,
        "test": [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U postgres -d postgres"
        ],
        "timeout": "5s",
        "interval": "5s",
        "start_period": "10s"
      },
      "volumes": [
        "assessment-postgres:/var/lib/postgresql/data",
        "postgres-setup:/run/setup:ro"
      ],
      "restart": "unless-stopped",
      "image": "postgres:17-bookworm"
    },
