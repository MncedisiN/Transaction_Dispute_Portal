        "Redis__Enabled": "false"
      }
    },
    "bootstrap": {
      "restart": "no",
      "environment": {
        "PORTAL_PUBLIC_URL": "${PORTAL_PUBLIC_URL:-http://localhost:8080}",
        "PUSH_SUBJECT": "${PUSH_SUBJECT:-}",
        "PORTAL_PRIVATE_SETTINGS": "/run/private/messaging.json",
        "API_DATABASE_PROVIDER": "${API_DATABASE_PROVIDER:-SqlServer}",
        "REQUIRE_CONTACT_VERIFICATION": "${REQUIRE_CONTACT_VERIFICATION:-false}",
        "EXTERNAL_MESSAGES_ENABLED": "${EXTERNAL_MESSAGES_ENABLED:-false}",
        "POPULATE_ASSESSMENT_ACCOUNTS": "${POPULATE_ASSESSMENT_ACCOUNTS:-true}",
        "PORTAL_LAN_IP": "${PORTAL_LAN_IP:-}",
        "PORTAL_HTTPS_PORT": "${PORTAL_HTTPS_PORT:-8443}",
        "PORTAL_CERTIFICATE_PORT": "${PORTAL_CERTIFICATE_PORT:-8081}"
      },
      "volumes": [
        "installation-state:/state",
        "postgres-setup:/settings/postgres",
        "identity-settings:/settings/identity",
        "configuration-settings:/settings/configuration",
        "accounts-settings:/settings/accounts",
        "ledger-settings:/settings/ledger",
        "transactions-settings:/settings/transactions",
        "payments-settings:/settings/payments",
        "notifications-settings:/settings/notifications",
        "audit-settings:/settings/audit",
        "reporting-settings:/settings/reporting",
        "scheduling-settings:/settings/scheduling",
        "debt-settings:/settings/debt",
        {
          "type": "bind",
          "source": "./private",
          "target": "/run/private",
          "read_only": true
        },
        "sqlserver-setup:/settings/sqlserver",
        "local-https:/settings/https"
      ],
      "build": {
        "dockerfile": "infrastructure/Docker/Bootstrap.Dockerfile",
        "context": "."
      },
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
