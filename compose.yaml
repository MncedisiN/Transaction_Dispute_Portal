{
  "name": "capitec-dispute-portal",
  "volumes": {
    "accounts-settings": {},
    "assessment-data-protection": {},
    "application-logs": {},
    "notifications-settings": {},
    "identity-settings": {},
    "reporting-settings": {},
    "configuration-settings": {},
    "scheduling-settings": {},
    "postgres-setup": {},
    "assessment-postgres": {},
    "transactions-settings": {},
    "audit-settings": {},
    "installation-state": {},
    "payments-settings": {},
    "ledger-settings": {},
    "debt-settings": {},
    "sqlserver-setup": {},
    "assessment-sqlserver": {},
    "local-https": {}
  },
  "services": {
    "api": {
      "volumes": [
        "identity-settings:/run/portal:ro",
        "application-logs:/app/Logs/Application",
        "assessment-data-protection:/var/dp-keys"
      ],
      "stop_grace_period": "30s",
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "depends_on": {
        "configuration": {
          "condition": "service_healthy"
        },
        "transactions": {
          "condition": "service_healthy"
        },
        "reporting": {
          "condition": "service_healthy"
        },
        "postgres": {
          "condition": "service_healthy"
        },
        "scheduling": {
          "condition": "service_healthy"
        },
        "bootstrap": {
          "condition": "service_completed_successfully"
        },
        "notifications": {
          "condition": "service_healthy"
        },
        "audit": {
          "condition": "service_healthy"
        },
        "debt": {
          "condition": "service_healthy"
        },
        "accounts": {
          "condition": "service_healthy"
        },
        "payments": {
          "condition": "service_healthy"
        },
        "ledger": {
          "condition": "service_healthy"
        },
        "api-setup": {
          "condition": "service_completed_successfully"
        }
      },
      "entrypoint": [
        "dotnet",
        "DisputePortal.Api.dll"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "cap_drop": [
        "ALL"
      ],
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile"
      },
      "environment": {
        "Platform__SettingsPath": "/run/portal/settings.json",
        "PortalLogging__Directory": "/app/Logs/Application/api",
        "PortalLogging__ConsoleEnabled": "true",
        "Redis__Enabled": "false",
        "ASPNETCORE_ENVIRONMENT": "Development",
        "Database__Provider": "${API_DATABASE_PROVIDER:-SqlServer}",
        "Authentication__AllowStaffLoginPreference": "false",
        "Platform__Enabled": "true",
        "ASPNETCORE_URLS": "http://+:8080",
        "Authentication__RequireStaffMfa": "false",
        "Database__ApplyMigrationsOnStartup": "false",
        "BankingProvisioning__Enabled": "false",
        "Platform__BrokerEnabled": "false",
        "DOTNET_gcServer": "${DOTNET_SERVER_GC:-0}",
        "DevelopmentSeed__Enabled": "true",
        "DataProtection__KeysDirectory": "/var/dp-keys",
        "DOTNET_PROCESSOR_COUNT": "${SERVICE_PROCESSOR_COUNT:-2}",
        "Authentication__LoginOtpEnabled": "false"
      }
    },
    "reporting": {
      "volumes": [
        "reporting-settings:/run/portal:ro",
        "application-logs:/app/Logs/Application"
      ],
      "stop_grace_period": "30s",
