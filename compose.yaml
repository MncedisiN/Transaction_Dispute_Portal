        "ACCEPT_EULA": "Y",
        "MSSQL_PID": "Developer",
        "MSSQL_MEMORY_LIMIT_MB": "${SQLSERVER_MEMORY_LIMIT_MB:-1024}"
      },
      "entrypoint": [
        "/bin/bash",
        "-c",
        "export MSSQL_SA_PASSWORD=\"$$(cat /run/setup/admin-password)\"; exec /opt/mssql/bin/sqlservr"
      ],
      "volumes": [
        "assessment-sqlserver:/var/opt/mssql",
        "sqlserver-setup:/run/setup:ro"
      ],
      "depends_on": {
        "bootstrap": {
          "condition": "service_completed_successfully"
        }
      },
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "SQLCMDPASSWORD=\"$$(cat /run/setup/admin-password)\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q \"SELECT 1\" -b -o /dev/null"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 60,
        "start_period": "20s"
      }
    },
    "sqlserver-setup": {
      "image": "mcr.microsoft.com/mssql/server:2025-latest",
      "entrypoint": [
        "/bin/bash",
        "/run/initialize-sqlserver.sh"
      ],
      "volumes": [
        "sqlserver-setup:/run/setup:ro",
        "./infrastructure/database/initialize-sqlserver.sh:/run/initialize-sqlserver.sh:ro",
        "./DisputePortal.Api/Database/SqlServer/Initialization:/run/schema:ro"
      ],
      "depends_on": {
        "sqlserver": {
          "condition": "service_healthy"
        }
      },
      "restart": "no"
    },
    "api-setup": {
      "volumes": [
        "identity-settings:/run/portal:ro",
        "application-logs:/app/Logs/Application",
        "assessment-data-protection:/var/dp-keys"
      ],
      "stop_grace_period": "30s",
      "restart": "no",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "entrypoint": [
        "/bin/sh",
        "-c",
        "if [ \"$$Database__Provider\" = \"PostgreSql\" ]; then exec dotnet DisputePortal.Api.dll --initialize; fi"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "3",
          "max-size": "10m"
        }
      },
      "cap_drop": [
        "ALL"
      ],
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile"
      },
      "environment": {
        "Platform__SettingsPath": "/run/portal/settings.json",
        "PortalLogging__Directory": "/app/Logs/Application/api",
        "PortalLogging__ConsoleEnabled": "true",
        "Redis__Enabled": "false",
        "ASPNETCORE_ENVIRONMENT": "Development",
        "Database__Provider": "${API_DATABASE_PROVIDER:-SqlServer}",
        "Authentication__AllowStaffLoginPreference": "false",
        "Platform__Enabled": "true",
        "ASPNETCORE_URLS": "http://+:8080",
        "Authentication__RequireStaffMfa": "false",
        "Database__ApplyMigrationsOnStartup": "false",
        "BankingProvisioning__Enabled": "false",
        "Platform__BrokerEnabled": "false",
        "DOTNET_gcServer": "${DOTNET_SERVER_GC:-0}",
        "DevelopmentSeed__Enabled": "false",
        "DataProtection__KeysDirectory": "/var/dp-keys",
        "DOTNET_PROCESSOR_COUNT": "${SERVICE_PROCESSOR_COUNT:-2}",
        "Authentication__LoginOtpEnabled": "false"
      },
      "depends_on": {
        "bootstrap": {
          "condition": "service_completed_successfully"
        },
        "postgres": {
          "condition": "service_healthy"
        },
        "sqlserver-setup": {
          "condition": "service_completed_successfully"
        }
      }
    }
  }
}
