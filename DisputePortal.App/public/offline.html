<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
    <title>Offline — Dispute Portal</title>
    <link
      rel="stylesheet"
      href="/w3.css"
    />
    <link
      rel="stylesheet"
      href="/w3-theme-blue.css"
    />
  </head>
  <body class="w3-theme-l5 w3-sans-serif">
    <header class="w3-white w3-border-bottom w3-container w3-padding-16">
      <a
        href="/"
        class="w3-button w3-large"
      >
        <img
          src="/app-icon.svg"
          width="32"
          height="32"
          alt=""
          class="w3-margin-right"
        />
        <b>Dispute Portal</b>
      </a>
    </header>
    <main class="w3-auto w3-container w3-padding-64">
      <div class="w3-row">
        <div
          class="w3-col l4 m3 w3-hide-small"
          aria-hidden="true"
        >
          &nbsp;
        </div>
        <section
          class="w3-col s12 m6 l4 w3-white w3-border w3-round-large w3-container w3-padding-32 w3-center"
        >
          <h1 class="w3-xlarge"><b>You're Offline</b></h1>
          <p class="w3-text-grey">
            Private transaction and dispute information needs a secure connection. Reconnect to
            continue.
          </p>
          <a
            href="/"
            class="w3-button w3-teal w3-block w3-round-large w3-padding-16"
          >
            Try Again
          </a>
        </section>
      </div>
    </main>
  </body>
</html>
