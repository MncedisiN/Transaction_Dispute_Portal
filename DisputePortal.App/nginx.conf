server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/portal-routes.conf;
}

server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/https/server.pem;
    ssl_certificate_key /run/https/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    root /usr/share/nginx/html;
    index index.html;
    proxy_cookie_flags ~ secure;
    include /etc/nginx/portal-routes.conf;
}

server {
    listen 8081;
    absolute_redirect off;
    server_name _;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = / {
        return 302 /install.html;
    }

    location = /install.html {
        default_type text/html;
        alias /run/https/install.html;
    }

    location = /authority.cer {
        default_type application/x-x509-ca-cert;
        alias /run/https/authority.cer;
    }

    location / {
        return 404;
    }
}
